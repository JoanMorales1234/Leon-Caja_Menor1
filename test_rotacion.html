<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Test Rotación Cropper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <style>
        body { font-family: Arial; padding: 20px; max-width: 900px; margin: 0 auto; }
        .row { display: flex; gap: 20px; }
        .col { flex: 1; }
        img { max-width: 100%; }
        #preview { max-width: 100%; max-height: 300px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
        .area-imagen { min-height: 300px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    </style>
</head>
<body>
    <h2>Test de Rotación con Cropper.js</h2>
    <p>Selecciona una imagen y prueba los botones de rotación.</p>

    <div class="row">
        <div class="col">
            <h3>Original</h3>
            <div class="area-imagen" id="container">
                <img id="image" src="" alt="Selecciona una imagen">
            </div>
            <p><input type="file" id="input" accept="image/*"></p>
            <p>
                <button id="btnLeft" style="background:#0d6efd;color:#fff;border:none;border-radius:4px;">↺ Rotar Izquierda</button>
                <button id="btnRight" style="background:#0d6efd;color:#fff;border:none;border-radius:4px;">↻ Rotar Derecha</button>
            </p>
            <p>
                <button id="btnCrop" style="background:#198754;color:#fff;border:none;border-radius:4px;">✓ Obtener imagen rotada</button>
            </p>
        </div>
        <div class="col">
            <h3>Resultado (rotado + recortado)</h3>
            <div class="area-imagen" id="resultContainer" style="background:#eee;">
                <img id="result" src="" alt="Resultado">
            </div>
            <p id="info" style="font-size:12px;color:#666;"></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script>
        var image = document.getElementById('image');
        var input = document.getElementById('input');
        var result = document.getElementById('result');
        var btnLeft = document.getElementById('btnLeft');
        var btnRight = document.getElementById('btnRight');
        var btnCrop = document.getElementById('btnCrop');
        var info = document.getElementById('info');
        var cropper = null;

        input.addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            if (cropper) { cropper.destroy(); cropper = null; }
            result.src = '';
            info.textContent = 'Cargando...';
            var reader = new FileReader();
            reader.onload = function(ev) {
                image.src = ev.target.result;
                image.onload = function() {
                    cropper = new Cropper(image, {
                        viewMode: 1,
                        autoCropArea: 1,
                        responsive: true
                    });
                    info.textContent = 'Cropper listo. Usa los botones de rotación.';
                };
            };
            reader.readAsDataURL(file);
        });

        btnLeft.addEventListener('click', function() {
            if (cropper) {
                cropper.rotate(-90);
                info.textContent = 'Rotado -90° (click en "Obtener imagen rotada" para verla)';
            } else {
                alert('Primero selecciona una imagen');
            }
        });

        btnRight.addEventListener('click', function() {
            if (cropper) {
                cropper.rotate(90);
                info.textContent = 'Rotado +90° (click en "Obtener imagen rotada" para verla)';
            } else {
                alert('Primero selecciona una imagen');
            }
        });

        btnCrop.addEventListener('click', function() {
            if (cropper) {
                var canvas = cropper.getCroppedCanvas();
                result.src = canvas.toDataURL('image/jpeg');
                info.textContent = 'Imagen obtenida. Ancho: ' + canvas.width + 'px, Alto: ' + canvas.height + 'px';
            } else {
                alert('Primero selecciona una imagen');
            }
        });
    </script>
</body>
</html>
